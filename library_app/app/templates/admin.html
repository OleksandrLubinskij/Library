{% extends "base.html" %} {% block title %}Адмін Панель{% endblock %} {% block
content %}
<h1 class="text-3xl font-extrabold text-gray-900 mb-6">
  Панель адміністратора
</h1>

<div class="flex border-b border-gray-200 mb-6 space-x-4">
  <button
    data-tab="add-book-tab"
    class="tab-btn pb-2 font-semibold text-indigo-600 border-b-2 border-indigo-600 focus:outline-none"
  >
    Додати Книгу
  </button>
  <button
    data-tab="add-author-tab"
    class="tab-btn pb-2 font-semibold text-gray-500 hover:text-indigo-600 focus:outline-none"
  >
    Додати Автора
  </button>
  <button
    data-tab="edit-book-tab"
    class="tab-btn pb-2 font-semibold text-gray-500 hover:text-indigo-600 focus:outline-none"
  >
    Редагувати Книгу
  </button>
</div>

<div
  id="add-book-tab"
  class="tab-content bg-white p-6 rounded-xl shadow-sm border border-gray-100"
>
  <h2 class="text-xl font-bold mb-4 text-gray-800">Додати нову книгу</h2>
  <form id="create-book-form" class="space-y-4 max-w-md">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1"
        >Назва книги</label
      >
      <input
        type="text"
        id="book-title"
        required
        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500"
      />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1"
        >Жанр книги</label
      >
      <input
        type="text"
        id="book-genre"
        required
        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500"
      />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1"
        >Рік випуску книги</label
      >
      <input
        type="number"
        id="book-release-year"
        required
        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:ring-indigo-500 focus:border-indigo-500"
      />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1"
        >ID Автора</label
      >
      <input
        type="number"
        id="book-author-id"
        required
        class="w-full border border-gray-300 rounded-lg px-3 py-2"
      />
    </div>
    <button
      type="submit"
      class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-lg transition"
    >
      Зберегти книгу
    </button>
  </form>
</div>

<div
  id="add-author-tab"
  class="tab-content bg-white p-6 rounded-xl shadow-sm border border-gray-100 hidden"
>
  <h2 class="text-xl font-bold mb-4 text-gray-800">
    Зареєструвати нового автора
  </h2>
  <form id="create-author-form" class="space-y-4 max-w-md">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1"
        >Ім'я автора</label
      >
      <input
        type="text"
        id="author_firstname"
        required
        class="w-full border border-gray-300 rounded-lg px-3 py-2"
      />

      <label class="block text-sm font-medium text-gray-700 mb-1"
        >Прізвище автора</label
      >
      <input
        type="text"
        id="author_lastname"
        required
        class="w-full border border-gray-300 rounded-lg px-3 py-2"
      />
    </div>
    <button
      type="submit"
      class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-lg transition"
    >
      Додати автора
    </button>
  </form>
</div>

<div
  id="edit-book-tab"
  class="tab-content bg-white p-6 rounded-xl shadow-sm border border-gray-100 hidden"
>
  <h2 class="text-xl font-bold mb-4 text-gray-800">
    Редагування інформації про книгу
  </h2>
  <div class="space-y-4 max-w-md">
    <div class="flex gap-2">
      <div class="flex-grow">
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Введіть ID книги</label
        >
        <input
          type="number"
          id="edit-book-id"
          class="w-full border border-gray-300 rounded-lg px-3 py-2"
        />
      </div>
      <button
        type="button"
        id="load-book-btn"
        class="mt-6 bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 rounded-lg font-medium transition text-xs"
      >
        Завантажити дані
      </button>
    </div>

    <form
      id="update-book-form"
      class="space-y-4 hidden pt-4 border-t border-gray-100"
    >
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Нова назва книги</label
        >
        <input
          type="text"
          id="edit-book-title"
          required
          class="w-full border border-gray-300 rounded-lg px-3 py-2"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Новий жанр книги</label
        >
        <input
          type="text"
          id="edit-book-genre"
          required
          class="w-full border border-gray-300 rounded-lg px-3 py-2"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Новий рік випуску книги</label
        >
        <input
          type="text"
          id="edit-book-release-year"
          required
          class="w-full border border-gray-300 rounded-lg px-3 py-2"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Новий ID Автора</label
        >
        <input
          type="number"
          id="edit-book-author-id"
          required
          class="w-full border border-gray-300 rounded-lg px-3 py-2"
        />
      </div>
      <button
        type="submit"
        class="bg-amber-500 hover:bg-amber-600 text-white font-semibold px-4 py-2 rounded-lg transition"
      >
        Оновити дані книги
      </button>
    </form>
  </div>
</div>

<script src="/static/js/admin.js" defer></script>
{% endblock %}
