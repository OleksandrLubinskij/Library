<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title id="page-title">Вхід до бібліотеки</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 flex items-center justify-center h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
      <h2
        id="form-title"
        class="text-2xl font-bold mb-6 text-center text-gray-800"
      >
        Вхід у систему
      </h2>

      <div
        id="error-message"
        class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded mb-4 text-sm text-center"
      ></div>

      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700"
            >Ім'я користувача (Username)</label
          >
          <input
            type="text"
            id="username"
            required
            class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Пароль</label>
          <input
            type="password"
            id="password"
            required
            class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div id="confirm-password-container" class="hidden">
          <label class="block text-sm font-medium text-gray-700"
            >Підтвердіть пароль</label
          >
          <input
            type="password"
            id="confirm-password"
            class="mt-1 w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <button
          type="submit"
          id="submit-btn"
          class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 font-semibold transition duration-200"
        >
          Увійти
        </button>
      </form>

      <div class="mt-6 text-center text-sm text-gray-600">
        <span id="toggle-text">Ще не маєте акаунту?</span>
        <button
          id="toggle-btn"
          class="text-blue-600 font-medium hover:underline ml-1 focus:outline-none"
        >
          Зареєструватися
        </button>
      </div>
    </div>

    <script src="/static/js/auth.js"></script>
  </body>
</html>
